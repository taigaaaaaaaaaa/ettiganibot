services:
  community-data-init:
    image: alpine:3.21
    user: "0:0"
    restart: "no"
    command:
      - /bin/sh
      - -c
      - mkdir -p /app/community-data /app/site-data && chown 1001:1001 /app/community-data /app/site-data && chmod 700 /app/community-data /app/site-data && if [ -f /app/site-data/dev-notes.json ]; then chown 1001:1001 /app/site-data/dev-notes.json; fi
    volumes:
      - ${COMMUNITY_DATA_HOST_PATH:-./community-data}:/app/community-data
      - ${DEV_NOTES_HOST_PATH:-./web/app/data}:/app/site-data

  web:
    build:
      context: ${WEB_BUILD_CONTEXT:-./web}
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      community-data-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      BOT_DATA_DIR: /app/bot-data
      ANNOUNCEMENTS_FILE: /app/site-data/announcements.json
      COMMUNITY_DATA_DIR: /app/community-data
      DEV_NOTES_FILE: /app/site-data/dev-notes.json
      DEV_NOTES_ENABLED: ${DEV_NOTES_ENABLED:-true}
      COMMUNITY_ENABLED: ${COMMUNITY_ENABLED:-true}
      SITE_MAINTENANCE: ${SITE_MAINTENANCE:-false}
      ADMIN_IDS: ${ADMIN_IDS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - ${BOT_DATA_HOST_PATH:-./ettiganibot/data}:/app/bot-data:ro
      - ${ANNOUNCEMENTS_HOST_PATH:-./web/app/data/announcements.json}:/app/site-data/announcements.json:ro
      - ${COMMUNITY_DATA_HOST_PATH:-./community-data}:/app/community-data
      - ${DEV_NOTES_HOST_PATH:-./web/app/data}:/app/site-data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/statistics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
